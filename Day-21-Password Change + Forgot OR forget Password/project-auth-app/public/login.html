<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Sign in | Northstar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="brand" href="/login" aria-label="Northstar home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span>northstar</span>
    </a>
    <section class="auth-card" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> Good to have you back</div>
      <h1 id="page-title">Welcome back</h1>
      <p class="subtitle">Sign in to pick up right where you left off.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div id="form-message" class="message" role="status" aria-live="polite"></div>
        <button id="submit-button" class="button button-primary" type="submit">
          <span class="button-label">Sign in</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <p class="auth-switch">New to Northstar? <a href="/register">Create an account</a></p>
    </section>
    <p class="auth-footer">A little more focus. A lot more momentum.</p>
  </main>
  <script src="js/login.js" defer></script>
</body>
</html>
