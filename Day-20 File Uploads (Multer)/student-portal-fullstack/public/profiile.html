<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>My Profile</h1>
    <p id="message" class="message"></p>

    <div class="card center">
      <img id="avatarImg" class="avatar" alt="Profile picture" hidden>
      <p id="noPicture">Abhi koi picture nahi hai</p>
      <h2 id="userName"></h2>
      <p id="userEmail"></p>
    </div>

    <div class="card">
      <h3>Profile Picture Upload Karo</h3>
      <form id="uploadForm">
        <input type="file" id="avatarInput" accept="image/*">
        <button type="submit">Upload</button>
      </form>
    </div>

    <button id="logoutBtn">Logout</button>
  </div>

  <script src="profile.js"></script>
</body>
</html>
