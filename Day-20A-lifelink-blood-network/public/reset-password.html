<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8f6">
  <title>Reset password · LifeLink</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/reset-password.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div data-site-header></div>
  <main id="main-content" class="container page-shell">
    <section class="account-section">
      <div class="section-heading">
        <p class="eyebrow">Account security</p>
        <h1>Choose a new password</h1>
        <p>Reset links expire after 30 minutes and can only be used once.</p>
      </div>
      <div class="auth-card">
        <form id="reset-password-form" class="form-stack" novalidate>
          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            <span class="field-hint">Use at least 8 characters.</span>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          </div>
          <button class="button button-primary button-full" type="submit">Reset password</button>
        </form>
        <p id="reset-password-message" class="form-message" role="status" aria-live="polite"></p>
        <a id="reset-login-link" class="text-link" href="index.html#account" hidden>Return to sign in</a>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
